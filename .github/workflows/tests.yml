name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell-tests:
    name: shell tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install git-lfs if missing
        run: |
          if ! command -v git-lfs >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install git-lfs
            else
              sudo apt-get update && sudo apt-get install -y git-lfs
            fi
          fi

      - name: Tool versions
        run: |
          bash --version | head -1
          /bin/bash --version | head -1
          git --version
          git lfs version
          python3 --version

      - name: Syntax-check the helper scripts
        run: |
          for f in bootstrap-assets/scripts/*.sh tests/*.sh; do
            /bin/bash -n "$f"
          done
          python3 -m py_compile bootstrap-assets/scripts/upgrade-roles.py \
            bootstrap-assets/tools/pka-tools bootstrap-assets/tools/pka_tools/*.py \
            tests/tools/*.py tests/fixtures/*.py scripts/*.py

      - name: Run the suite
        run: ./tests/run-all.sh

      # macOS ships bash 3.2 as /bin/bash, and that is what a user's
      # `#!/usr/bin/env bash` resolves to. Put it first on PATH so the suite
      # and every helper script it launches run on 3.2.
      - name: Run the suite under macOS system bash (3.2)
        if: runner.os == 'macOS'
        run: |
          mkdir "$RUNNER_TEMP/system-bash"
          ln -s /bin/bash "$RUNNER_TEMP/system-bash/bash"
          PATH="$RUNNER_TEMP/system-bash:$PATH" ./tests/run-all.sh

      # The Python a Mac user has without installing anything.
      - name: Run the pka-tools tests under macOS system Python
        if: runner.os == 'macOS'
        run: |
          if [ -x /usr/bin/python3 ] && /usr/bin/python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)'; then
            /usr/bin/python3 --version
            PKA_TEST_PYTHON=/usr/bin/python3 ./tests/test_tools.sh
          else
            echo "no usable /usr/bin/python3 on this runner; skipping"
          fi

  # pka-tools promises Python 3.9 (what /usr/bin/python3 is on a Mac with the
  # Xcode command line tools). The runners' default python3 is much newer and
  # setup-python no longer builds 3.9 for the current Ubuntu image, so run the
  # toolkit's own tests in the official 3.9 container.
  tools-python-39:
    name: pka-tools on Python 3.9
    runs-on: ubuntu-latest
    container: python:3.9-slim-bookworm
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: Tool versions
        run: |
          python3 --version
          python3 -c "import sqlite3; print('sqlite', sqlite3.sqlite_version)"
          git --version

      - name: Run the pka-tools tests
        run: bash ./tests/test_tools.sh
